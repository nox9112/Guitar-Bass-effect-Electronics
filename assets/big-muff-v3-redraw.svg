<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Big Muff Pi V3 — ToneForge local redraw draft</title><desc id="desc">American Version 3 Big Muff Pi redraw after ElectroSmash reference, 1976-1977 family.</desc>
<style>.bg{fill:#fff}.wire{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter}.node{fill:#111}.txt{font:19px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.sm{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.xs{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.head{font:700 23px system-ui,sans-serif;fill:#111}.warn{font:700 16px system-ui,sans-serif;fill:#8b2d2d}.box{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:8 6}.r{fill:none;stroke:#111;stroke-width:2.3}.cap{stroke:#111;stroke-width:2.3}.dev{fill:#fff;stroke:#111;stroke-width:2.4}.pot{fill:#fff;stroke:#111;stroke-width:2.2}.diode{fill:none;stroke:#111;stroke-width:2.2}</style>
<rect class="bg" width="1600" height="900"/><rect x="12" y="12" width="1576" height="876" fill="none" stroke="#111" stroke-width="2"/>
<text class="head" x="45" y="52">Electro-Harmonix Big Muff Pi · American V3 family</text><text class="sm" x="45" y="78">ToneForge local redraw after ElectroSmash V3 reference · draft</text>

