<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 760" role="img" aria-labelledby="title desc">
<title id="title">Vox V847 Wah — ToneForge local redraw</title><desc id="desc">Classic V847 two-transistor wah schematic with 500mH inductor and 100k sweep potentiometer.</desc>
<style>.bg{fill:#fff}.wire{fill:none;stroke:#111;stroke-width:2.8;stroke-linecap:square;stroke-linejoin:miter}.node{fill:#111}.txt{font:20px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.sm{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.xs{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.head{font:700 25px system-ui,sans-serif;fill:#111}.warn{font:700 16px system-ui,sans-serif;fill:#8b2d2d}.box{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:8 6}.r{fill:none;stroke:#111;stroke-width:2.6}.cap{stroke:#111;stroke-width:2.6}.bjt{fill:none;stroke:#111;stroke-width:2.6}.pot{fill:#fff;stroke:#111;stroke-width:2.5}</style>
<rect class="bg" width="1450" height="760"/><rect x="12" y="12" width="1426" height="736" fill="none" stroke="#111" stroke-width="2"/>
<text class="head" x="45" y="52">Vox V847 Wah · classic topology</text><text class="sm" x="45" y="78">ToneForge local redraw after ElectroSmash V847 reference · draft</text>
<rect class="box" x="35" y="110" width="610" height="500" rx="8"/><text class="head" x="60" y="145">INPUT / RESONANT STAGE</text>
<rect class="box" x="665" y="110" width="740" height="500" rx="8"/><text class="head" x="690" y="145">SWEEP / OUTPUT STAGE</text>

<!-- input -->
<circle class="wire" cx="75" cy="300" r="13"/><text class="sm" x="48" y="274">IN</text><line class="wire" x1="88" y1="300" x2="145" y2="300"/>
<path class="r" d="M145 300 l10 -10 10 20 10 -20 10 20 10 -20 10 10"/><line class="wire" x1="205" y1="300" x2="250" y2="300"/><text class="sm" x="148" y="270">R1 68k</text>
<line class="cap" x1="250" y1="278" x2="250" y2="322"/><line class="cap" x1="266" y1="278" x2="266" y2="322"/><line class="wire" x1="266" y1="300" x2="330" y2="300"/><text class="sm" x="235" y="270">C1 10n</text>

<!-- Q1 -->
<circle class="bjt" cx="390" cy="300" r="38"/><line class="wire" x1="330" y1="300" x2="352" y2="300"/><line class="wire" x1="390" y1="262" x2="390" y2="205"/><line class="wire" x1="390" y1="338" x2="390" y2="390"/><text class="sm" x="410" y="315">Q1 MPSA18</text>
<line class="wire" x1="390" y1="205" x2="390" y2="150"/><path class="r" d="M390 150 l-10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="390" y1="100" x2="390" y2="92"/><text class="sm" x="405" y="132">R3 22k</text><text class="sm" x="370" y="88">+9V</text>
<path class="r" d="M390 390 l-10 10 20 10 -20 10 20 10 -10 10"/><line class="wire" x1="390" y1="440" x2="390" y2="470"/><text class="sm" x="405" y="425">R4 510Ω</text><text class="xs" x="370" y="490">GND</text>
<line class="wire" x1="330" y1="300" x2="330" y2="390"/><path class="r" d="M330 390 l-10 10 20 10 -20 10 20 10 -10 10"/><line class="wire" x1="330" y1="440" x2="330" y2="470"/><text class="sm" x="275" y="425">R2 1.5k</text>

<!-- resonant branch -->
<circle class="node" cx="390" cy="205" r="4"/><line class="wire" x1="390" y1="205" x2="525" y2="205"/>
<path class="r" d="M525 205 l10 -10 10 20 10 -20 10 20 10 -20 10 10"/><line class="wire" x1="585" y1="205" x2="710" y2="205"/><text class="sm" x="530" y="175">R5 470k</text>
<line class="wire" x1="525" y1="205" x2="525" y2="280"/><path class="r" d="M525 280 l-10 10 20 10 -20 10 20 10 -10 10"/><line class="wire" x1="525" y1="330" x2="525" y2="385"/><text class="sm" x="540" y="315">R6 470k</text>
<circle class="node" cx="525" cy="385" r="4"/>
<path d="M495 385 q30 -34 60 0 q-30 34 -60 0" fill="none" stroke="#111" stroke-width="2.5"/><line class="wire" x1="525" y1="419" x2="525" y2="500"/><text class="sm" x="465" y="455">L1 500mH</text>
<path class="r" d="M585 385 l0 10 -10 10 20 10 -20 10 20 10 -10 10"/><line class="wire" x1="585" y1="385" x2="585" y2="455"/><line class="wire" x1="585" y1="455" x2="585" y2="500"/><text class="sm" x="600" y="425">R7 33k</text>
<line class="wire" x1="525" y1="385" x2="585" y2="385"/><line class="wire" x1="555" y1="385" x2="555" y2="340"/><line class="cap" x1="535" y1="340" x2="575" y2="340"/><line class="cap" x1="535" y1="326" x2="575" y2="326"/><line class="wire" x1="555" y1="326" x2="555" y2="300"/><text class="sm" x="570" y="338">C3 4.7µF</text>
<line class="wire" x1="610" y1="385" x2="610" y2="455"/><path class="r" d="M610 385 l10 10 -20 10 20 10 -20 10 10 10"/><line class="wire" x1="610" y1="455" x2="610" y2="500"/><text class="sm" x="625" y="425">R8 100k</text>

<!-- C5 / VR1 -->
<line class="wire" x1="390" y1="205" x2="660" y2="205"/><line class="cap" x1="660" y1="183" x2="660" y2="227"/><line class="cap" x1="676" y1="183" x2="676" y2="227"/><line class="wire" x1="676" y1="205" x2="760" y2="205"/><text class="sm" x="640" y="175">C5 0.22µF</text>
<rect class="pot" x="760" y="230" width="72" height="170"/><text class="sm" x="767" y="315">VR1</text><text class="sm" x="762" y="340">100k</text><line class="wire" x1="796" y1="230" x2="796" y2="205"/><line class="wire" x1="796" y1="400" x2="796" y2="470"/><text class="xs" x="778" y="490">GND</text><line class="wire" x1="832" y1="315" x2="900" y2="315"/>

<!-- Q2 output -->
<line class="cap" x1="900" y1="293" x2="900" y2="337"/><line class="cap" x1="916" y1="293" x2="916" y2="337"/><line class="wire" x1="916" y1="315" x2="980" y2="315"/><text class="sm" x="880" y="285">C4 0.22µF</text>
<circle class="bjt" cx="1035" cy="315" r="38"/><line class="wire" x1="980" y1="315" x2="997" y2="315"/><line class="wire" x1="1035" y1="277" x2="1035" y2="205"/><line class="wire" x1="1035" y1="353" x2="1035" y2="405"/><text class="sm" x="1055" y="330">Q2 MPSA18</text>
<path class="r" d="M1035 205 l-10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="1035" y1="155" x2="1035" y2="105"/><text class="sm" x="1050" y="180">R9 1k</text><text class="sm" x="1015" y="95">+9V</text>
<path class="r" d="M1035 405 l-10 10 20 10 -20 10 20 10 -10 10"/><line class="wire" x1="1035" y1="455" x2="1035" y2="480"/><text class="sm" x="1050" y="440">R10 10k</text><text class="xs" x="1016" y="500">GND</text>
<line class="wire" x1="710" y1="205" x2="710" y2="315"/><circle class="node" cx="710" cy="315" r="4"/><line class="wire" x1="710" y1="315" x2="900" y2="315"/>

<!-- feedback C2 to input -->
<line class="wire" x1="1035" y1="353" x2="1035" y2="545"/><line class="wire" x1="1035" y1="545" x2="820" y2="545"/><line class="cap" x1="820" y1="523" x2="820" y2="567"/><line class="cap" x1="804" y1="523" x2="804" y2="567"/><line class="wire" x1="804" y1="545" x2="330" y2="545"/><line class="wire" x1="330" y1="545" x2="330" y2="300"/><text class="sm" x="760" y="515">C2 10n feedback</text>

<!-- output -->
<line class="wire" x1="1035" y1="315" x2="1260" y2="315"/><circle class="wire" cx="1275" cy="315" r="13"/><text class="sm" x="1252" y="285">OUT</text>

<!-- footer -->
<line x1="25" y1="650" x2="1425" y2="650" stroke="#111" stroke-width="2"/><text class="warn" x="45" y="686">DRAFT / NOT BUILD-READY</text><text class="xs" x="45" y="710">ToneForge redraw after ElectroSmash V847 schematic. Source values: Q1/Q2 MPSA18 · C1/C2 10n · C3 4.7µF · C4/C5 0.22µF · L1 500mH · R1 68k · R2 1.5k · R3 22k · R4 510Ω · R5/R6 470k · R7 33k · R8 100k · R9 1k · R10 10k · VR1 100k.</text>
</svg>