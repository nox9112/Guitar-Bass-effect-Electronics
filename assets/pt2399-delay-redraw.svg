<style>.bg{fill:#fff}.wire{fill:none;stroke:#111;stroke-width:2.3;stroke-linecap:square;stroke-linejoin:miter}.thin{fill:none;stroke:#111;stroke-width:1.6}.node{fill:#111}.txt{font:20px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.sm{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.xs{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.head{font:700 24px system-ui,sans-serif;fill:#111}.title{font:700 28px system-ui,sans-serif;fill:#111}.warn{font:700 16px system-ui,sans-serif;fill:#8b2d2d}.box{fill:#fff;stroke:#111;stroke-width:1.7}.dash{fill:none;stroke:#666;stroke-width:1.4;stroke-dasharray:7 6}.r{fill:none;stroke:#111;stroke-width:2}.cap{stroke:#111;stroke-width:2}.ic{fill:#fff;stroke:#111;stroke-width:2}</style>
