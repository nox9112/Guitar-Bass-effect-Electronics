<text class="xs" x="875" y="610">1  VCC       16 LPF2-IN</text><text class="xs" x="875" y="635">2  REF       15 LPF2-OUT</text><text class="xs" x="875" y="660">3  AGND      14 LPF1-OUT</text><text class="xs" x="875" y="685">4  DGND      13 LPF1-IN</text><text class="xs" x="875" y="710">5  CLK-OUT   12 OP2-OUT</text><text class="xs" x="875" y="735">6  VCO       11 OP2-IN</text><text class="xs" x="875" y="760">7/8 filter   9/10 filter</text>
<line class="wire" x1="860" y1="560" x2="810" y2="560"/><text class="sm" x="790" y="535">+5V</text>

