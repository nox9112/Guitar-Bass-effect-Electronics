<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 820" role="img" aria-labelledby="title desc">
<title id="title">Tone Bender Mark II Professional PNP Germanium — ToneForge local redraw</title><desc id="desc">Local redraw based on the General Guitar Gadgets PNP Germanium Mark II Professional replica schematic.</desc>
<style>.bg{fill:#fff}.wire{fill:none;stroke:#111;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter}.node{fill:#111}.txt{font:19px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.sm{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.xs{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.head{font:700 24px system-ui,sans-serif;fill:#111}.warn{font:700 16px system-ui,sans-serif;fill:#8b2d2d}.box{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:8 6}.r{fill:none;stroke:#111;stroke-width:2.3}.cap{stroke:#111;stroke-width:2.3}.dev{fill:#fff;stroke:#111;stroke-width:2.5}.pot{fill:#fff;stroke:#111;stroke-width:2.3}</style>
<rect class="bg" width="1450" height="820"/><rect x="12" y="12" width="1426" height="796" fill="none" stroke="#111" stroke-width="2"/>
<text class="head" x="45" y="52">ColorSound / Sola Sound Tone Bender Mark II Professional</text><text class="sm" x="45" y="78">PNP Germanium · ToneForge local redraw after GGG 2012Feb09 · draft</text><text class="sm" x="1040" y="78">Q1/Q2/Q3: OC81D or PNP Germanium</text>

<!-- positive-ground supply reference -->
<line class="wire" x1="110" y1="145" x2="1110" y2="145"/><text class="sm" x="62" y="150">−9V rail</text>
<line class="wire" x1="160" y1="145" x2="160" y2="215"/><line class="cap" x1="135" y1="215" x2="185" y2="215"/><path d="M135 235 q25 18 50 0" fill="none" stroke="#111" stroke-width="2.5"/><line class="wire" x1="160" y1="235" x2="160" y2="275"/><text class="sm" x="190" y="228">C5 47µF</text><text class="xs" x="143" y="295">GND / + battery</text>

<!-- input -->
<circle class="wire" cx="75" cy="390" r="12"/><text class="sm" x="45" y="365">J1 IN</text><rect class="dev" x="115" y="360" width="70" height="55"/><text class="xs" x="126" y="392">SW1a</text><line class="wire" x1="87" y1="390" x2="115" y2="390"/><line class="wire" x1="185" y1="390" x2="245" y2="390"/>
<path class="r" d="M215 390 l0 15 -10 10 20 10 -20 10 20 10 -10 10"/><text class="sm" x="230" y="440">R9 1.5M</text><line class="wire" x1="215" y1="455" x2="215" y2="485"/><text class="xs" x="198" y="505">GND</text>
<line class="cap" x1="245" y1="368" x2="245" y2="412"/><path d="M261 368 q-12 22 0 44" fill="none" stroke="#111" stroke-width="2.3"/><line class="wire" x1="261" y1="390" x2="330" y2="390"/><text class="sm" x="225" y="350">C1 4.7µF</text>
<line class="wire" x1="290" y1="390" x2="290" y2="455"/><line class="cap" x1="270" y1="455" x2="310" y2="455"/><line class="cap" x1="270" y1="471" x2="310" y2="471"/><line class="wire" x1="290" y1="471" x2="290" y2="500"/><text class="sm" x="305" y="470">C6 0.01µF</text>
<path class="r" d="M330 390 l0 15 -10 10 20 10 -20 10 20 10 -10 10"/><line class="wire" x1="330" y1="455" x2="330" y2="485"/><text class="sm" x="345" y="440">R1 100k</text>

<!-- Q1 -->
<circle class="dev" cx="400" cy="390" r="34"/><text class="sm" x="375" y="445">Q1</text><line class="wire" x1="330" y1="390" x2="366" y2="390"/><line class="wire" x1="400" y1="356" x2="400" y2="285"/><line class="wire" x1="400" y1="424" x2="400" y2="485"/>
<path class="r" d="M400 285 l-10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="400" y1="235" x2="400" y2="145"/><text class="sm" x="415" y="260">R2 10k</text><text class="xs" x="385" y="505">GND</text>

<!-- C2 to Q2 -->
<line class="wire" x1="400" y1="285" x2="505" y2="285"/><line class="cap" x1="505" y1="263" x2="505" y2="307"/><line class="cap" x1="521" y1="263" x2="521" y2="307"/><line class="wire" x1="521" y1="285" x2="585" y2="285"/><text class="sm" x="485" y="245">C2 0.1µF</text>

<!-- Q2 -->
<circle class="dev" cx="630" cy="350" r="34"/><text class="sm" x="605" y="405">Q2</text><line class="wire" x1="585" y1="285" x2="630" y2="285"/><line class="wire" x1="630" y1="285" x2="630" y2="316"/><line class="wire" x1="630" y1="384" x2="630" y2="465"/>
<path class="r" d="M630 285 l0 -10 -10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="630" y1="225" x2="630" y2="145"/><text class="sm" x="645" y="245">R3 47k</text><text class="xs" x="613" y="485">GND</text>

<!-- Q2/Q3 feedback / bias -->
<line class="wire" x1="630" y1="285" x2="760" y2="285"/><circle class="dev" cx="805" cy="350" r="34"/><text class="sm" x="780" y="405">Q3</text><line class="wire" x1="760" y1="285" x2="805" y2="285"/><line class="wire" x1="805" y1="285" x2="805" y2="316"/><line class="wire" x1="805" y1="384" x2="805" y2="445"/>
<line class="wire" x1="630" y1="465" x2="710" y2="465"/><path class="r" d="M710 465 l10 -10 10 20 10 -20 10 20 10 -20 10 10"/><line class="wire" x1="770" y1="465" x2="805" y2="445"/><text class="sm" x="715" y="435">R4 100k</text>
<path class="r" d="M805 285 l0 -10 -10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="805" y1="225" x2="805" y2="145"/><text class="sm" x="820" y="245">R6 8.2k</text>

<!-- attack -->
<line class="wire" x1="805" y1="445" x2="805" y2="500"/><rect class="pot" x="770" y="500" width="70" height="110"/><text class="xs" x="780" y="535">R7</text><text class="xs" x="778" y="555">ATTACK</text><text class="xs" x="775" y="575">1k REV LOG</text><line class="wire" x1="840" y1="555" x2="900" y2="555"/><line class="cap" x1="900" y1="533" x2="900" y2="577"/><path d="M916 533 q-12 22 0 44" fill="none" stroke="#111" stroke-width="2.3"/><line class="wire" x1="916" y1="555" x2="916" y2="610"/><text class="sm" x="885" y="515">C4 4.7µF</text><text class="xs" x="898" y="630">GND</text>

<!-- output collector path -->
<line class="wire" x1="805" y1="285" x2="930" y2="285"/><path class="r" d="M930 285 l10 -10 10 20 10 -20 10 20 10 -20 10 10"/><line class="wire" x1="990" y1="285" x2="1040" y2="285"/><text class="sm" x="935" y="255">R5 1k</text>
<line class="cap" x1="1040" y1="263" x2="1040" y2="307"/><line class="cap" x1="1056" y1="263" x2="1056" y2="307"/><line class="wire" x1="1056" y1="285" x2="1120" y2="285"/><text class="sm" x="1020" y="245">C3 0.01µF</text>
<rect class="pot" x="1120" y="235" width="75" height="120"/><text class="xs" x="1130" y="275">R8</text><text class="xs" x="1128" y="295">VOLUME</text><text class="xs" x="1125" y="315">100k LOG</text><line class="wire" x1="1195" y1="295" x2="1240" y2="295"/><rect class="dev" x="1240" y="268" width="70" height="55"/><text class="xs" x="1250" y="300">SW1b</text><line class="wire" x1="1310" y1="295" x2="1360" y2="295"/><circle class="wire" cx="1375" cy="295" r="12"/><text class="sm" x="1348" y="270">J2 OUT</text>

<line x1="25" y1="720" x2="1425" y2="720" stroke="#111" stroke-width="2"/><text class="warn" x="45" y="755">DRAFT / PNP POSITIVE-GROUND — NOT BUILD-READY</text><text class="xs" x="45" y="780">ToneForge redraw after GGG PNP Germanium Mark II Professional replica. GGG adds R9 input pulldown / modern true-bypass LED wiring; historical units vary. Verify transistor leakage/hFE, polarity, OC81D pinouts and bias before assembly.</text>
