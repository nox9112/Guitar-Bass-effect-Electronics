<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 820" role="img" aria-labelledby="title desc">
<title id="title">Dan Armstrong Green Ringer — ToneForge local redraw draft</title><desc id="desc">Local redraw based on the General Guitar Gadgets Green Ringer replica schematic.</desc>
<style>.bg{fill:#fff}.wire{fill:none;stroke:#111;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter}.node{fill:#111}.txt{font:19px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.sm{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.xs{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#111}.head{font:700 24px system-ui,sans-serif;fill:#111}.warn{font:700 16px system-ui,sans-serif;fill:#8b2d2d}.box{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:8 6}.r{fill:none;stroke:#111;stroke-width:2.3}.cap{stroke:#111;stroke-width:2.3}.dev{fill:#fff;stroke:#111;stroke-width:2.5}</style>
<rect class="bg" width="1450" height="820"/><rect x="12" y="12" width="1426" height="796" fill="none" stroke="#111" stroke-width="2"/>
<text class="head" x="45" y="52">Dan Armstrong Green Ringer · GGG replica</text><text class="sm" x="45" y="78">ToneForge local redraw after GGG 2012Jan10 · draft</text>
<text class="sm" x="1040" y="78">Q1/Q3 2N5088/2N5089 · Q2 2N3906 low gain</text>

<!-- power rail -->
<line class="wire" x1="110" y1="150" x2="1280" y2="150"/><text class="sm" x="75" y="155">+9V</text>
<line class="wire" x1="1280" y1="150" x2="1280" y2="215"/><line class="cap" x1="1255" y1="215" x2="1305" y2="215"/><path d="M1255 235 q25 18 50 0" fill="none" stroke="#111" stroke-width="2.5"/><line class="wire" x1="1280" y1="235" x2="1280" y2="275"/><text class="sm" x="1305" y="230">C4 100µF</text><text class="xs" x="1260" y="295">GND</text>

<!-- input -->
<circle class="wire" cx="75" cy="390" r="12"/><text class="sm" x="45" y="365">J1 IN</text><rect class="dev" x="115" y="360" width="70" height="55"/><text class="xs" x="126" y="392">SW1a</text><line class="wire" x1="87" y1="390" x2="115" y2="390"/><line class="wire" x1="185" y1="390" x2="240" y2="390"/>
<path class="r" d="M215 390 l0 15 -10 10 20 10 -20 10 20 10 -10 10"/><line class="wire" x1="215" y1="455" x2="215" y2="485"/><text class="sm" x="230" y="440">R13 1.5M</text><text class="xs" x="198" y="505">GND</text>
<line class="cap" x1="240" y1="368" x2="240" y2="412"/><line class="cap" x1="256" y1="368" x2="256" y2="412"/><line class="wire" x1="256" y1="390" x2="330" y2="390"/><text class="sm" x="222" y="350">C1 0.047µF</text>

<!-- Q1 bias -->
<circle class="dev" cx="390" cy="390" r="34"/><text class="sm" x="360" y="445">Q1</text><line class="wire" x1="330" y1="390" x2="356" y2="390"/><line class="wire" x1="390" y1="356" x2="390" y2="300"/><line class="wire" x1="390" y1="424" x2="390" y2="480"/>
<line class="wire" x1="330" y1="390" x2="330" y2="235"/><path class="r" d="M330 235 l-10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="330" y1="185" x2="330" y2="150"/><text class="sm" x="345" y="215">R1 560k</text>
<line class="wire" x1="330" y1="390" x2="330" y2="485"/><path class="r" d="M330 485 l-10 10 20 10 -20 10 20 10 -10 10"/><text class="sm" x="275" y="520">R2 160k</text>
<path class="r" d="M390 300 l-10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="390" y1="250" x2="390" y2="150"/><text class="sm" x="405" y="275">R3 18k</text>
<path class="r" d="M390 480 l-10 10 20 10 -20 10 20 10 -10 10"/><text class="sm" x="405" y="515">R4 6.2k</text>

<!-- coupling Q1 to Q2 -->
<line class="wire" x1="390" y1="300" x2="500" y2="300"/><path class="r" d="M500 300 l-10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="500" y1="250" x2="500" y2="150"/><text class="sm" x="515" y="275">R5 10k</text>
<line class="cap" x1="520" y1="278" x2="520" y2="322"/><line class="cap" x1="536" y1="278" x2="536" y2="322"/><line class="wire" x1="536" y1="300" x2="610" y2="300"/><text class="sm" x="510" y="258">C2 0.047µF</text>

<!-- Q2 phase splitter -->
<circle class="dev" cx="660" cy="360" r="34"/><text class="sm" x="635" y="415">Q2</text><line class="wire" x1="610" y1="300" x2="660" y2="300"/><line class="wire" x1="660" y1="300" x2="660" y2="326"/><line class="wire" x1="660" y1="394" x2="660" y2="470"/>
<line class="wire" x1="610" y1="300" x2="610" y2="235"/><path class="r" d="M610 235 l-10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="610" y1="185" x2="610" y2="150"/><text class="sm" x="625" y="215">R5 10k</text>
<path class="r" d="M660 470 l-10 10 20 10 -20 10 20 10 -10 10"/><text class="sm" x="675" y="505">R6 10k</text>

<!-- upper rectifier branch -->
<line class="wire" x1="660" y1="300" x2="770" y2="300"/><polygon points="770,290 790,300 770,310" fill="none" stroke="#111" stroke-width="2"/><line class="wire" x1="790" y1="290" x2="790" y2="310"/><line class="wire" x1="790" y1="300" x2="875" y2="300"/><text class="sm" x="755" y="270">D1 matched</text>
<path class="r" d="M845 300 l0 -10 10 -10 -20 -10 20 -10 -20 -10 10 -10"/><line class="wire" x1="845" y1="240" x2="845" y2="150"/><text class="sm" x="860" y="220">R9 22k</text>
<line class="wire" x1="790" y1="300" x2="790" y2="345"/><path class="r" d="M790 345 l10 10 -20 10 20 10 -20 10 10 10"/><line class="wire" x1="790" y1="395" x2="875" y2="395"/><text class="sm" x="805" y="370">R7 68k</text>

<!-- lower rectifier branch -->
<line class="wire" x1="660" y1="470" x2="730" y2="470"/><line class="cap" x1="730" y1="448" x2="730" y2="492"/><line class="cap" x1="746" y1="448" x2="746" y2="492"/><line class="wire" x1="746" y1="470" x2="790" y2="470"/><text class="sm" x="710" y="430">C3 0.047µF</text><polygon points="790,460 810,470 790,480" fill="none" stroke="#111" stroke-width="2"/><line class="wire" x1="810" y1="460" x2="810" y2="480"/><line class="wire" x1="810" y1="470" x2="875" y2="470"/><text class="sm" x="775" y="445">D2 matched</text>
<path class="r" d="M790 470 l10 10 -20 10 20 10 -20 10 10 10"/><line class="wire" x1="790" y1="520" x2="875" y2="520"/><text class="sm" x="805" y="505">R8 68k</text>
<path class="r" d="M875 470 l10 10 -20 10 20 10 -20 10 10 10"/><line class="wire" x1="875" y1="520" x2="875" y2="550"/><text class="sm" x="890" y="505">R10 22k</text>

<!-- Q3 output -->
<line class="wire" x1="875" y1="300" x2="975" y2="300"/><line class="wire" x1="875" y1="470" x2="975" y2="470"/><line class="wire" x1="975" y1="300" x2="975" y2="360"/><circle class="dev" cx="1025" cy="390" r="34"/><text class="sm" x="1000" y="445">Q3</text><line class="wire" x1="975" y1="360" x2="991" y2="390"/><line class="wire" x1="1025" y1="356" x2="1025" y2="150"/><line class="wire" x1="1025" y1="424" x2="1025" y2="500"/>
<path class="r" d="M1025 500 l-10 10 20 10 -20 10 20 10 -10 10"/><text class="sm" x="1040" y="535">R11 10k</text>
<line class="wire" x1="975" y1="360" x2="975" y2="235"/><path class="r" d="M975 235 l-10 -10 20 -10 -20 -10 20 -10 -10 -10"/><line class="wire" x1="975" y1="185" x2="975" y2="150"/><text class="sm" x="990" y="215">R? bias</text>

<!-- output coupling -->
<line class="wire" x1="1059" y1="390" x2="1120" y2="390"/><line class="cap" x1="1120" y1="368" x2="1120" y2="412"/><line class="cap" x1="1136" y1="368" x2="1136" y2="412"/><line class="wire" x1="1136" y1="390" x2="1200" y2="390"/><text class="sm" x="1100" y="350">C5 0.1µF</text>
<path class="r" d="M1180 390 l0 15 -10 10 20 10 -20 10 20 10 -10 10"/><text class="sm" x="1195" y="440">R12 47k</text><rect class="dev" x="1225" y="360" width="70" height="55"/><text class="xs" x="1236" y="392">SW1b</text><line class="wire" x1="1295" y1="390" x2="1350" y2="390"/><circle class="wire" cx="1365" cy="390" r="12"/><text class="sm" x="1338" y="365">J2 OUT</text>

<!-- footer -->
<line x1="25" y1="720" x2="1425" y2="720" stroke="#111" stroke-width="2"/><text class="warn" x="45" y="755">DRAFT / NOT BUILD-READY</text><text class="xs" x="45" y="780">ToneForge redraw after GGG Green Ringer replica schematic (2012Jan10). Original PDF is linked only and not rehosted. Verify Q1/Q2/Q3 pinouts, diode orientation/matching, switch contacts and all node connections before assembly.</text>
