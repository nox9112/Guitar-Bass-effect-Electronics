name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ToneForge V2
        uses: actions/checkout@v4
        with:
          ref: toneforge-v2
      - name: Prepare production assets
        shell: bash
        run: |
          set -euo pipefail
          for name in styles.css schematic-v2.css wiring-schematics.js schematic-viewer-v3.js schematic-renderer.js pedal-schematics.js; do
            base64 -d ".deploy/${name}.gz.b64" | gzip -d > "${name}"
          done
          rm -rf .deploy
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
