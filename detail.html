<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e12"><title>Detail · Guitar/Bass Electronics</title><link rel="stylesheet" href="styles.css"></head><body><main class="detail"><a class="backlink" href="index.html">← Zur Übersicht</a><div id="content"></div></main><script>const q=new URLSearchParams(location.search),type=q.get('type'),id=q.get('id');const D={pedal:{'fuzz-face':{n:'Fuzz Face',k:'Fuzz',d:'Zweistufiger Transistor-Fuzz. Germanium-Versionen reagieren besonders stark auf das Gitarren-Volume und erzeugen weiches bis asymmetrisches Clipping.',use:['Classic Rock','Cleanup über Volume-Poti','Bass-Fuzz mit größeren Koppelkondensatoren'],sig:'Input → Q1 → Rückkopplung → Q2 → Volume → Output',bom:[['Transistor','2× AC128 oder Silizium-Alternative'],['Widerstände','33 kΩ, 470 Ω, 8.2 kΩ, 100 kΩ + Bias-Anpassung'],['Kondensatoren','2.2 µF, 22 µF, 10 nF'],['Potis','Fuzz 1 kΩ lin, Volume 500 kΩ log'],['Mechanik','3PDT, 2× Klinke, DC, 1590B/125B']],cost:'ca. 35–70 €',build:'Q1/Q2 sockeln. Bei PNP-Germanium Massekonzept beachten. Q2-Collector grob um die halbe Betriebsspannung abgleichen.',src:'https://electrosmash.com/fuzz-face'},'tube-screamer':{n:'Tube Screamer-artig',k:'Overdrive',d:'OpAmp-Overdrive mit Dioden im Gegenkopplungszweig. Soft-Clipping plus charakteristische Mittenbetonung.',use:['Blues','Metal-Boost','Lead','Bass mit Blend'],sig:'Buffer → 4558 Gain/Clip → Tone → Level → Buffer',bom:[['IC','JRC4558 / RC4558'],['Dioden','2× 1N4148/1N914'],['Potis','Drive 500 kΩ, Tone ca. 20–25 kΩ, Level 100 kΩ'],['Passivteile','R/C-Satz nach TS808/TS9'],['Mechanik','3PDT, 2× Klinke, DC, Gehäuse']],cost:'ca. 30–60 €',build:'Vref auf etwa 4.5 V. OpAmp sockeln. Bias- und Audiopfad sauber trennen.',src:'https://www.electrosmash.com/tube-screamer-analysis'},rat:{n:'RAT-artig',k:'Distortion',d:'Hohe OpAmp-Verstärkung mit antiparallelem Hard-Clipping gegen Masse und nachgeschaltetem Tiefpass-Filter.',use:['Punk','Alternative','Metal','Bass-Distortion'],sig:'Input → LM308/OP07 → Hard Clip → Filter → Volume',bom:[['IC','LM308N oder OP07'],['Dioden','2× 1N4148'],['Potis','Distortion, Filter, Volume je ca. 100 kΩ'],['Passivteile','R/C-Satz nach RAT-Referenz'],['Mechanik','3PDT, Klinken, DC, Gehäuse']],cost:'ca. 35–65 €',build:'IC und Clipping-Dioden sockeln. Gain-Leitungen möglichst kurz halten.',src:'https://www.electrosmash.com/proco-rat'},'big-muff':{n:'Big Muff Pi-artig',k:'Fuzz / Sustain',d:'Vier Transistorstufen, zwei Dioden-Clippingstufen, passiver Tone-Stack und Recovery-Stufe.',use:['Doom','Stoner','Shoegaze','Bass-Fuzz'],sig:'Q1 Boost → Q2 Clip → Q3 Clip → Tone → Q4 → Volume',bom:[['Transistoren','4× 2N5088/BC550C'],['Dioden','4× 1N4148'],['Potis','Sustain/Tone/Volume je ca. 100 kΩ'],['Passivteile','ca. 20 Widerstände, 13 Kondensatoren je Version'],['Mechanik','3PDT, Klinken, DC, Gehäuse']],cost:'ca. 35–70 €',build:'Vorab Version festlegen: Triangle, Ram’s Head, Russian etc.; Werte unterscheiden sich.',src:'https://electrosmash.mas-effects.com/big-muff-pi-analysis.html'},compressor:{n:'Dyna-Comp-artig',k:'Compressor',d:'OTA-basierter Kompressor. Der Envelope-Detector steuert die Verstärkung und reduziert Dynamikspitzen.',use:['Country','Clean','Sustain','Bass-Leveling'],sig:'Buffer → OTA → Output; Envelope → OTA-Control',bom:[['OTA','CA3080 oder geeignete Ersatzschaltung'],['Transistoren','mehrere Kleintransistoren, z. B. 2N3904'],['Dioden','1N914/1N4148'],['Potis','Output/Sensitivity'],['Trimmer','Bias/Balance je nach Schaltung']],cost:'ca. 40–80 €',build:'OTA sockeln. Bias/Envelope zuerst separat prüfen.',src:'https://www.electrosmash.com/mxr-dyna-comp-analysis'},phase90:{n:'Phase 90-artig',k:'Phaser',d:'Vier Allpass-Stufen verschieben die Phase; ein LFO moduliert gematchte JFETs und bewegt die Auslöschungen.',use:['Clean-Arpeggios','Leads','Bass-Sweep'],sig:'Buffer → 4× Allpass/JFET → Dry Mix → Output; LFO → JFET',bom:[['JFETs','4× gematchte JFETs'],['OpAmp','TL072/ähnlich'],['Poti','Speed'],['Passivteile','R/C-Netzwerk der Allpass-Stufen'],['Trimmer','JFET-Bias']],cost:'ca. 45–90 €',build:'JFETs matchen und Bias auf gleichmäßigen Sweep einstellen.',src:'https://www.electrosmash.com/mxr-phase90'},chorus:{n:'CE-2-artig',k:'Chorus',d:'BBD verzögert eine Signalkopie; ein LFO moduliert die Delay-Zeit. Dry + Wet erzeugt den Chorus-Eindruck.',use:['80s Clean','Bass Chorus','Doubling'],sig:'Preamp → BBD → Filter → Mix → Output; LFO/Clock',bom:[['BBD','MN3007 oder kompatibel'],['Clock','MN3101 oder kompatibel'],['OpAmps','4558/TL022 o. ä.'],['Potis','Rate + Depth'],['Passivteile','Filter-, Bias- und Clock-Netzwerk']],cost:'ca. 70–140 €',build:'BBD/Clock sockeln. Bias und Clock abgleichen; Clock-Leitungen vom Audiopfad fernhalten.',src:'https://www.electrosmash.com/boss-ce-2-chorus/pedals/delay/boss-ce-2-analysis.html'},pt2399:{n:'PT2399 Delay',k:'Delay',d:'Digitales Delay-IC mit analogem Ein-/Ausgangsfilter. Feedback erzeugt Wiederholungen bis hin zur Selbstoszillation.',use:['Slapback','Ambient','Dub','Lo-Fi'],sig:'Input Filter → PT2399 → Wet Filter → Mix ↔ Feedback',bom:[['IC','PT2399'],['Regler','5-V-Regler'],['Potis','Delay, Feedback, Mix'],['OpAmp','optional TL072'],['Passivteile','R/C-Netzwerk nach Datenblatt']],cost:'ca. 30–60 €',build:'Saubere 5 V. Analog- und Digitalseite sinnvoll entkoppeln. Lange Delayzeiten werden deutlich lo-fi.',src:'https://www.princeton.com.tw/Portals/0/Product/PT2399_1.pdf'}},amp:{'5f1':{n:'5F1 Champ',k:'Röhrenverstärker · ca. 5 W',d:'Klassischer Single-Ended-Röhrenamp mit sehr kleiner Bauteilezahl und frühem Endstufen-Overdrive.',use:['Home Recording','Vintage Clean/Crunch','Pedal Platform bei moderatem Pegel'],sig:'Input → 12AX7 Preamp → 6V6 Power → Output Transformer → Speaker',bom:[['Röhren','1× 12AX7, 1× 6V6, 1× 5Y3'],['Trafos','Netztrafo + Ausgangstrafo'],['Lautsprecher','8–10 Zoll, passende Impedanz'],['Chassis','Metallchassis, Sockel, Sicherung, Netzschalter'],['Passivteile','Hochvolt-Widerstände/Kondensatoren nach 5F1-Plan']],cost:'ca. 300–500 €',build:'Turret/Eyelet-Aufbau. Masseführung sorgfältig planen. Netz- und Heizleitungen verdrillen.',src:'https://www.thetubestore.com/lib/thetubestore/schematics/Fender/Fender-Champ-5F1-Schematic.pdf',hv:true},'5e3':{n:'5E3 Deluxe',k:'Röhrenverstärker · ca. 12–15 W',d:'Kathodenbias-Push-Pull-Amp mit zwei interagierenden Volume-Reglern und starkem Vintage-Kompressionsverhalten.',use:['Blues','Roots','Recording','Vintage Crunch'],sig:'Inputs → 12AY7/12AX7 Preamp → Phase Inverter → 2×6V6 → OT → Speaker',bom:[['Röhren','12AY7/12AX7, 12AX7, 2×6V6, 5Y3'],['Trafos','Netztrafo + Ausgangstrafo'],['Lautsprecher','12 Zoll'],['Chassis','Tweed-Style Chassis, Sockel, Schalter, Sicherung'],['Passivteile','Hochvolt-R/C-Satz nach 5E3']],cost:'ca. 450–750 €',build:'Eyelet-Board-Aufbau. Lead Dress ist wichtig für Brumm- und Schwingneigung.',src:'https://www.thetubestore.com/lib/thetubestore/schematics/Fender/Fender-Deluxe-5E3-Schematic.pdf',hv:true},'jcm800-2204':{n:'JCM800 2204-artig',k:'Röhrenverstärker · 50 W',d:'Master-Volume-Röhrenamp mit kaskadierten Vorstufen und EL34-Endstufe. Deutlich komplexer und leistungsstärker.',use:['Hard Rock','Metal','Punk','Pedal Platform'],sig:'Input → kaskadierte ECC83-Stufen → Tone Stack → PI → 2×EL34 → OT',bom:[['Röhren','3× ECC83/12AX7, 2× EL34'],['Trafos','leistungsfähiger Netz- und Ausgangstrafo'],['Chassis','großes Stahl-/Aluchassis'],['Netzteil','Hochvolt-Elkos, Dioden, Sicherungen'],['Bedienelemente','Gain, Master, 3-Band-EQ, Presence']],cost:'ca. 700–1100 €',build:'Nur für erfahrenen Hochvolt-Aufbau. Masse, Lead Dress, Screen-/Grid-Stoppers und Schutzleiterführung kritisch.',src:'https://www.drtube.com/schematics/marshall/2204prem.gif',hv:true},ac15:{n:'AC15-artig',k:'Röhrenverstärker · ca. 15 W',d:'EL84-basierter Class-AB-Amp mit britischem Voicing, glockigen Höhen und charakteristischem Endstufen-Crunch.',use:['Indie','Classic Rock','Chime','Recording'],sig:'Preamp → Tone Network → Phase Inverter → 2×EL84 → OT',bom:[['Röhren','Vorstufenröhren + 2× EL84'],['Trafos','Netztrafo + Ausgangstrafo'],['Speaker','12 Zoll'],['Chassis','Sockel, Sicherung, Netzschalter'],['Passivteile','Hochvolt-R/C-Satz nach gewählter AC15-Variante']],cost:'ca. 500–850 €',build:'Topologie variiert je Version; konkrete Referenz vor Baubeginn festlegen.',src:'https://www.voxshowroom.com/uk/amp/ac15_hood.html',hv:true},b15n:{n:'B-15N-artig',k:'Bass-Röhrenverstärker',d:'Klassischer Bass-Amp-Ansatz mit warmem, komprimiertem Röhrenton und relativ einfacher Vorstufe.',use:['Bass Recording','Soul','Motown','Vintage Rock'],sig:'Bass Input → Tube Preamp → Tone → PI/Power Stage → OT → Bass Speaker',bom:[['Röhren','je nach B-15N-Version'],['Trafos','Bass-tauglicher Ausgangstrafo + Netztrafo'],['Speaker','Bass-Speaker mit passendem Cabinet'],['Chassis','stabiler Hochvolt-Aufbau'],['Passivteile','nach gewählter B-15N-Revision']],cost:'ca. 700–1200 €',build:'Mehrere Revisionen existieren. Ausgangstrafo und Netzteil sind kostenbestimmend.',src:'https://ampeg.com/support/files/Schematics/',hv:true},ruby:{n:'Ruby / LM386',k:'Mini Solid-State Amp',d:'Sehr kleiner Transistor/IC-Amp für Üben, Testbench und eingebaute Mini-Verstärker.',use:['Werkstatt-Testamp','Mini Combo','Kopfhörer-/Kleinspeaker-Projekte'],sig:'Input Buffer/Gain → LM386 → Speaker',bom:[['IC','LM386'],['FET','optional JFET-Inputbuffer'],['Potis','Gain/Volume'],['Passivteile','wenige R/C-Teile'],['Speaker','kleiner 8-Ω-Speaker']],cost:'ca. 15–40 €',build:'Auf Lochraster problemlos. Versorgung 9–12 V; Ausgangselko ausreichend dimensionieren.',src:'https://www.runoffgroove.com/ruby.html'},tda7294:{n:'TDA7294 Power Amp',k:'Solid-State · ca. 50–70 W',d:'Leistungs-IC-Endstufe für Gitarren-/Bass-Poweramp-Projekte. Benötigt Vorstufe, Netzteil und großen Kühlkörper.',use:['Bass Combo','Gitarren-Poweramp','Rack-Endstufe'],sig:'Preamp → TDA7294 → Speaker',bom:[['IC','TDA7294'],['Netzteil','symmetrisch, passend dimensionierter Trafo + Gleichrichtung'],['Kühlung','großer Kühlkörper + Isoliermaterial'],['Schutz','Sicherungen, optional Speaker-Protection'],['Passivteile','R/C-Netzwerk nach Datenblatt']],cost:'ca. 90–180 €',build:'Kühlung, Sternmasse und Netzteilführung sind entscheidend. IC elektrisch vom Kühlkörper isolieren, falls erforderlich.',src:'https://www.st.com/resource/en/datasheet/tda7294.pdf'}},wiring:{'strat-5way':{n:'Strat 5-Way Wiring',k:'SSS Gitarrenschaltung',d:'Klassische 3-Single-Coil-Schaltung mit 5-Wege-Schalter, Master Volume und zwei Tone-Reglern.',use:['Strat-Style Guitars','Vintage Wiring','Mod-Plattform'],sig:'3 Pickups → 5-Way Blade → Volume/Tone → Output',bom:[['Schalter','5-Way Blade'],['Potis','3× 250 kΩ'],['Kondensator','22–47 nF Tone Cap'],['Buchse','6.3-mm Mono'],['Draht','isolierter Hookup Wire']],cost:'ca. 20–45 €',build:'Masse stern-/busartig sauber führen; Schalterbelegung je Hersteller prüfen.',src:'https://www.seymourduncan.com/resources/pickup/wiring-diagrams'},'tele-3way':{n:'Tele 3-Way Wiring',k:'SS Gitarrenschaltung',d:'Zwei Pickups mit 3-Wege-Schalter: Bridge, beide parallel, Neck.',use:['Tele-Style','Rock','Country'],sig:'Bridge/Neck → 3-Way → Volume/Tone → Output',bom:[['Schalter','3-Way Blade'],['Potis','2× 250 kΩ'],['Kondensator','22–47 nF'],['Buchse','6.3-mm Mono'],['Draht','Hookup Wire']],cost:'ca. 15–35 €',build:'Bridge-Grundplatte und Saitenerdung berücksichtigen.',src:'https://www.seymourduncan.com/resources/pickup/wiring-diagrams'},'les-paul':{n:'Les Paul 50s / Modern Wiring',k:'HH Gitarrenschaltung',d:'Zwei Humbucker, zwei Volume und zwei Tone. 50s- und modernes Wiring unterscheiden sich in der Position des Tone-Netzwerks.',use:['Les Paul Style','Vintage Mods','Independent Controls'],sig:'Neck/Bridge HB → 3-Way Toggle → 2×Volume/2×Tone → Output',bom:[['Schalter','3-Way Toggle'],['Potis','4× 500 kΩ'],['Caps','2× 22 nF typ.'],['Buchse','6.3-mm Mono'],['Draht','geschirmt + Hookup Wire']],cost:'ca. 25–60 €',build:'50s Wiring verändert die Interaktion von Volume und Tone. Abschirmung sinnvoll.',src:'https://www.seymourduncan.com/resources/pickup/wiring-diagrams'},'coil-split':{n:'Coil Split',k:'Humbucker Mod',d:'Eine Humbucker-Spule wird kurzgeschlossen/abgeschaltet, um einen Single-Coil-ähnlichen Klang zu erhalten.',use:['Mehr Klangvarianten','Push/Pull Mods','HH/HSS'],sig:'4-Conductor Humbucker → Push/Pull → Series Link to Ground',bom:[['Pickup','4-adriger Humbucker'],['Schalter','Push/Pull oder Mini-Toggle DPDT'],['Draht','Hookup Wire']],cost:'ca. 8–20 €',build:'Farbcodes der Pickup-Hersteller unterscheiden sich.',src:'https://www.seymourduncan.com/resources/pickup/wiring-diagrams'},'series-parallel':{n:'Series / Parallel Humbucker',k:'Humbucker Mod',d:'Beide Spulen bleiben hum-cancelling, werden aber wahlweise seriell oder parallel verschaltet.',use:['High Output / Clear Tone','Bass Humbucker','Flexible HH Wiring'],sig:'Coil A + Coil B → DPDT Series/Parallel → Controls',bom:[['Pickup','4-adriger Humbucker'],['Schalter','DPDT Push/Pull oder Toggle'],['Draht','Hookup Wire']],cost:'ca. 8–20 €',build:'Phasenlage und Start/Finish jeder Spule korrekt zuordnen.',src:'https://www.seymourduncan.com/resources/pickup/wiring-diagrams'},'treble-bleed':{n:'Treble Bleed',k:'Volume Mod',d:'Kleines RC-Netzwerk am Volume-Poti erhält Höhen beim Zurückdrehen.',use:['Clean-up','Single Coils','Humbucker'],sig:'Volume Input ↔ RC Network ↔ Volume Wiper',bom:[['Kondensator','typ. 680 pF–1.5 nF'],['Widerstand','typ. 100–220 kΩ optional']],cost:'ca. 1–5 €',build:'Werte nach Pickup/Poti anpassen; parallel oder seriell RC möglich.',src:'https://www.seymourduncan.com/blog/latest-updates/treble-bleed-mod'},'blower-switch':{n:'Blower Switch',k:'Direct-Out Mod',d:'Schaltet den ausgewählten Pickup direkt auf die Ausgangsbuchse und umgeht Volume/Tone.',use:['Solo Boost','Maximale Brillanz','Live-Switching'],sig:'Pickup → Switch → Output / normaler Control Path',bom:[['Schalter','DPDT/3PDT je Konzept'],['Draht','Hookup Wire']],cost:'ca. 5–15 €',build:'Schalter so verdrahten, dass der normale Pfad vollständig isoliert wird.',src:'https://www.seymourduncan.com/resources/pickup/wiring-diagrams'}},pickup:{'strat-pickup':{n:'Strat Single Coil',k:'Pickup-Selbstbau',d:'Schmale Spule mit sechs Alnico-Stabmagneten. Klassischer klarer Single-Coil-Sound.',use:['Strat-Style','Vintage Clean','Pickup-Winding lernen'],sig:'String Flux → Alnico Rods → Coil → Output',bom:[['Magnetdraht','42 AWG Poly/Nylon'],['Windungen','typ. ca. 7.000–8.500'],['Magnete','6× Alnico Rod'],['Flatwork','Top + Bottom Fiber'],['Sonstiges','Eyelets, Lead Wire, Tape/Wachs']],cost:'ca. 15–35 € pro Pickup',build:'Spule gleichmäßig wickeln, Start/Finish markieren, DCR prüfen, danach optional Wachs-Potting.',src:'https://www.stewmac.com/video-and-ideas/online-resources/learn-about-guitar-pickups-and-electronics/'},'tele-bridge-pickup':{n:'Tele Bridge Pickup',k:'Pickup-Selbstbau',d:'Single Coil mit Metall-Baseplate; typischer fokussierter, aggressiver Bridge-Ton.',use:['Telecaster','Country','Rock'],sig:'String Flux → Rod Magnets/Baseplate → Coil → Output',bom:[['Magnetdraht','42 oder 43 AWG'],['Magnete','6× Alnico Rod'],['Baseplate','Stahl/Kupfer-beschichtet je Design'],['Flatwork','Fiber'],['Sonstiges','Lead Wire, Tape/Wachs']],cost:'ca. 20–40 €',build:'Baseplate erden. Wickelrichtung/Magnetpolarität passend zum Neck-Pickup planen.',src:'https://www.stewmac.com/video-and-ideas/online-resources/learn-about-guitar-pickups-and-electronics/'},p90:{n:'P-90',k:'Pickup-Selbstbau',d:'Breitere, flache Single-Coil-Spule mit Pole Screws und zwei Barmagneten.',use:['Rock','Blues','Raw Midrange'],sig:'Strings → Pole Screws → Bar Magnets → Wide Coil → Output',bom:[['Magnetdraht','42 AWG'],['Windungen','ca. 9.000–10.500 je Zielwert'],['Magnete','2× Alnico Bar'],['Mechanik','6 Pole Screws, Keeper, Baseplate, Bobbin/Cover']],cost:'ca. 25–50 €',build:'Magnete gegensinnig am Keeper ausrichten; DCR/Induktivität nach Wicklung messen; optional Potting.',src:'https://www.stewmac.com/video-and-ideas/online-resources/learn-about-guitar-pickups-and-electronics/'},paf:{n:'PAF-artiger Humbucker',k:'Pickup-Selbstbau',d:'Zwei Spulen mit gemeinsamer Barmagnet-Anordnung. Gegensinnige Wicklung/Polarität reduziert Brumm.',use:['Classic Rock','Blues','HH Guitars'],sig:'Strings → Slug/Screw Coils → Bar Magnet → Series/Parallel Output',bom:[['Magnetdraht','42 AWG'],['Windungen','ca. 2× 4.500–5.500'],['Magnet','Alnico 2/3/4/5 Bar'],['Mechanik','Slug Bobbin, Screw Bobbin, Baseplate, Pole Screws/Slugs'],['Sonstiges','4-Conductor Cable, Tape, Cover optional']],cost:'ca. 35–70 €',build:'Spulen möglichst paarweise dokumentieren. Magnetpolarität und Coil-Start/Finish markieren. Cover bei Bedarf potten.',src:'https://www.stewmac.com/video-and-ideas/online-resources/learn-about-guitar-pickups-and-electronics/'},'p-bass':{n:'Precision Bass Split Coil',k:'Bass-Pickup-Selbstbau',d:'Zwei gegensinnig gewickelte und magnetisierte Halbspulen bilden zusammen einen hum-cancelling Pickup.',use:['P-Bass','Rock','Studio'],sig:'String Pairs → 2 Split Coils → Series → Output',bom:[['Magnetdraht','42/43 AWG'],['Magnete','8 Alnico Rods insgesamt'],['Flatwork/Bobbins','2 Halbspulen'],['Lead Wire','2- oder 4-adrig je Mod']],cost:'ca. 25–50 €',build:'RWRP-Konzept zwischen den beiden Hälften exakt einhalten.',src:'https://www.stewmac.com/video-and-ideas/online-resources/learn-about-guitar-pickups-and-electronics/'},'j-bass':{n:'Jazz Bass Single Coil',k:'Bass-Pickup-Selbstbau',d:'Lange schmale Bass-Single-Coil-Spule mit acht Pole Pieces.',use:['J-Bass','Funk','Rock','Fingerstyle'],sig:'Strings → Alnico Rods → Long Coil → Output',bom:[['Magnetdraht','42/43 AWG'],['Magnete','8× Alnico Rod'],['Flatwork','Neck/Bridge passend'],['Lead Wire','Hookup Wire']],cost:'ca. 20–45 €',build:'Neck- und Bridge-Pickup als RWRP-Paar auslegen, wenn Mittelstellung brummfrei sein soll.',src:'https://www.stewmac.com/video-and-ideas/online-resources/learn-about-guitar-pickups-and-electronics/'}}};const x=D[type]?.[id];if(!x){content.innerHTML='<h1>Nicht gefunden</h1><p class="lead">Diese Detailseite existiert noch nicht.</p>'}else{const bom=x.bom.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');content.innerHTML=`<div class="detail-top"><div><span class="ey">${x.k}</span><h1>${x.n}</h1><p class="lead">${x.d}</p></div><div class="bigvis"><svg class="icon" viewBox="0 0 120 100"><rect x="17" y="12" width="86" height="72" rx="10" fill="#414c57"/><circle cx="43" cy="34" r="8" fill="#12171c"/><circle cx="77" cy="34" r="8" fill="#12171c"/><circle cx="60" cy="65" r="10" fill="#d6dde1"/></svg><svg class="wave" viewBox="0 0 150 100"><line class="axis" x1="0" y1="50" x2="150" y2="50"/><path class="in" d="M0 50C12 15 25 15 37 50S62 85 75 50S100 15 112 50S137 85 150 50"/><path class="out" d="M0 50C10 8 25 10 36 30L44 30C51 34 52 43 55 50C62 72 70 79 79 72C89 64 93 55 97 50C104 29 115 10 127 15C139 20 143 35 150 50"/></svg></div></div><div class="boxes"><section class="box"><h3>Beschreibung & Einsatz</h3><ul>${x.use.map(v=>`<li>${v}</li>`).join('')}</ul></section><section class="box"><h3>Signalweg</h3><p>${x.sig}</p></section><section class="box full"><h3>Materialliste / Stückliste</h3><table class="bom"><tbody>${bom}</tbody></table></section><section class="box"><h3>Bauplan / Aufbau</h3><p>${x.build}</p>${x.hv?'<p class="warning">Achtung: Röhrenverstärker enthalten lebensgefährliche Spannungen, auch nach dem Ausschalten durch geladene Kondensatoren.</p>':''}</section><section class="box"><h3>Kostenüberschlag</h3><div class="cost">${x.cost}</div><p>Grobe DIY-Spanne; Trafos, Gehäuse, Röhren, Versand und Bezugsquelle verändern den Preis deutlich.</p></section><section class="box full"><h3>Schaltplan / Referenz</h3><a class="source" target="_blank" rel="noopener" href="${x.src}">Referenzquelle öffnen ↗</a></section></div>`}</script></body></html>
